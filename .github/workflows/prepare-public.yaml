name: Temporary official FP China migration
on:
  push:
    branches: [prepare/fp-china-public031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve ordinary formal graph
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Original complete gates before edits
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --strict-types --warn-dyn-method --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --list --format json > acceptance/test-list-before.json
          yarn build
          yarn test
      - name: Official guarded source transaction
        run: node apply-reviewed.mjs
      - name: Complete original gates and relative production build
        run: |
          set -euo pipefail
          calcit edit format
          calcit --strict-types --warn-dyn-method --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --list --format json > acceptance/test-list-after.json
          yarn build
          yarn test
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - name: Save official evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fp-china-source-evidence
          path: acceptance/
          if-no-files-found: error
          retention-days: 7
